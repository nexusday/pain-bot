<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0f" />
  <meta name="description" content="Panel de control para vincular y administrar tus sub-bots de WhatsApp." />
  <meta name="robots" content="noindex, nofollow" />
  <title>PAIN BOT MD</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <link rel="preload" as="image" href="/assets/logo.webp" />
<!-- Sin versión fija en los assets: el servidor los sirve con Cache-Control:
     no-cache y ETag, así el navegador revalida y trae la versión nueva con un
     F5 normal. La versión se declara SOLO en panel-config.js y PANEL_VERSION
     (test/webpanel-version-sync.test.js vigila que coincidan). -->
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/cards.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
  <link rel="stylesheet" href="/assets/css/server-picker.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <link rel="stylesheet" href="/assets/css/overlays.css" />
  <link rel="stylesheet" href="/assets/css/mainbot.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-mark" aria-hidden="true">
        <img src="/assets/logo.webp" alt="" />
      </div>
      <div class="boot-spinner" aria-hidden="true"></div>
      <p>Cargando panel…</p>
    </div>
  </div>
  <div id="modal-root" aria-live="polite"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="false"></div>
  <noscript>Este panel necesita JavaScript para funcionar.</noscript>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
